name: Build Game APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libffi7 libssl3
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y libstdc++6:i386 zlib1g:i386 openjdk-17-jdk
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    - name: Setup Virtual SDK Paths for Buildozer
      run: |
        # ĐÁNH LỪA BUILDOZER: Tạo thư mục ảo tools/bin để vượt qua bước quét sdkmanager cũ
        sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
        sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        echo "=== Đã tạo đường dẫn liên kết ảo lừa Buildozer thành công ==="

    - name: Force Wipe Corrupted Build Cache
      run: |
        # Đã gỡ bỏ cache GitHub và ép xóa sạch mọi tệp phân phối chip cũ bị kẹt làm tràn RAM
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        echo "=== Đã làm sạch toàn bộ môi trường và bộ nhớ đệm lỗi ==="

    - name: Build Android APK with Pygame Backend
      run: |
        # Ép hệ thống ghi đè đường dẫn NDK chuẩn ổn định của GitHub vào môi trường
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_NDK=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # Tiến hành biên dịch sạch từ đầu một cách an toàn
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CaveBird-Game-APK
        path: bin/*.apk
