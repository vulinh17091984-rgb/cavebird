name: Build Game APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Sử dụng bộ cài đặt chuyên dụng chính thức, tự vá lỗi tầng dịch C cho Pygame
      - name: Build Android APK with Buildozer Action
        uses: ArtemvK/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: master

      # Tự động xuất file APK hoàn chỉnh lên mục Artifacts để tải về điện thoại Note 10
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: CaveBird-Game-APK
          path: bin/*.apk
