name: Build Game APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer và Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Install Android Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libffi7 libssl3
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y libstdc++6:i386 zlib1g:i386 openjdk-17-jdk
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    - name: Clean Corrupted Distribution Cache
      run: |
        rm -rf .buildozer/android/platform/build-arm64-v8a/dists/
        echo "=== Đã dọn dẹp phân phối lỗi thành công ==="

    - name: Pre-accept Android SDK Licenses
      run: |
        # Kích hoạt trước sdkmanager của Buildozer nếu thư mục đã tồn tại trong Cache để tự chấp nhận bản quyền
        if [ -d "$HOME/.buildozer/android/platform/android-sdk/tools/bin" ]; then
          yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true
        fi

    - name: Build Android APK with Pygame Backend
      run: |
        # Gỡ bỏ các biến môi trường NDK mặc định của GitHub để tránh xung đột
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK
        
        # Cấu hình biến ép tự động đồng ý điều khoản bản quyền cho các công cụ dòng lệnh của Android
        export ANDROID_LICENSE_ACCEPT=yes
        
        # Tiến hành build game bằng cờ tự động chấp nhận bản quyền của Buildozer
        buildozer android debug
