name: Build Game APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- ĐÃ NÂNG CẤP: Bổ sung đầy đủ tất cả các gói dev hệ thống để fix lỗi biên dịch Pygame sang C ---
      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config libltdl-dev libffi-dev libssl-dev cmake openjdk-17-jdk libsqlite3-dev sqlite3 bzip2 libbz2-dev liblzma-dev

      - name: Install Buildozer and Cython
        run: pip install buildozer cython==0.29.33

      - name: Auto Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android licenses || true

      - name: Build Android APK with Buildozer
        run: |
          export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25c
          export ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r25c
          buildozer android debug

      # --- BƯỚC MỚI: TỰ ĐỘNG XUẤT FILE APK KHI ROBOT CHẠY XONG ---
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: CaveBird-Game-APK
          path: bin/*.apk
