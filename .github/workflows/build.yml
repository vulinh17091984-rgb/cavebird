name: Build Game APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer và Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Install Android Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libffi7 libssl3
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y libstdc++6:i386 zlib1g:i386 openjdk-17-jdk
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    - name: Force Accept Android Licenses via System SDK
      run: |
        # Thiết lập biến môi trường trỏ trực tiếp vào kho Android SDK chuẩn có sẵn của máy ảo GitHub
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Đồng ý toàn bộ bản quyền điều khoản của Google chính thống
        yes | sdkmanager --licenses
        
        # Cài đặt chính xác phiên bản Build-Tools và API cần thiết vào kho lưu trữ hệ thống
        yes | sdkmanager "build-tools;34.0.0" "platforms;android-33" "platform-tools"
        
        # Tạo liên kết đánh lừa Buildozer sang thư mục hệ thống đã cài đặt sẵn để đồng bộ Aidl
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
        cp /usr/local/lib/android/sdk/build-tools/34.0.0/aidl $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl || true
        echo "=== Đã đồng bộ bản quyền Google SDK hệ thống thành công ==="

    - name: Clean Corrupted Distribution Cache
      run: |
        rm -rf .buildozer/android/platform/build-arm64-v8a/dists/

    - name: Build Android APK with Pygame Backend
      run: |
        # Ép Buildozer nhận diện kho SDK hệ thống đã được đồng ý bản quyền trọn vẹn
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK
        
        # Chạy lệnh đóng gói ứng dụng
        buildozer android debug
