name: Build Game APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Bước thiết lập Cache giúp lưu lại SDK/NDK để lần sau không bị lỗi tải mạng
    - name: Cache Buildozer và Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libffi7 libssl3
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    - name: Build Android APK
      run: |
        # Chạy biên dịch từng bước giúp giảm thiểu tối đa tình trạng cạn RAM máy ảo
        buildozer android debug
