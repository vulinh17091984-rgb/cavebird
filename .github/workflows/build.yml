name: Build Game APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer và Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Install Android Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libffi7 libssl3
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y libstdc++6:i386 zlib1g:i386 openjdk-17-jdk
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    - name: Force Install SDK and Accept Licenses
      run: |
        # Khởi tạo trước cấu trúc thư mục SDK của Buildozer nếu chưa có
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        
        # Tải công cụ quản lý chính thức từ Google thay vì để Buildozer tự động tải lỗi
        wget -q https://google.com -O cmdline.zip
        unzip -q cmdline.zip
        mv cmdline-tools/* $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
        
        # Ép hệ thống đồng ý toàn bộ bản quyền SDK của Google một cách chính thống
        export PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        yes | sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses
        
        # Cài đặt trước bộ build-tools bản 34.0.0 ổn định
        yes | sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "build-tools;34.0.0" "platforms;android-33" "platform-tools"
        
        # Sửa lỗi Aidl bằng cách liên kết công cụ đã cài đặt vào vị trí Buildozer tìm kiếm
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
        cp $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl || true
        echo "=== Đã xử lý thủ công bản quyền và công cụ Aidl thành công ==="

    - name: Clean Corrupted Distribution Cache
      run: |
        rm -rf .buildozer/android/platform/build-arm64-v8a/dists/

    - name: Build Android APK with Pygame Backend
      run: |
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK
        
        # Chạy lệnh build trực tiếp, Buildozer sẽ nhận diện được bộ build-tools đã cài ở bước trước
        buildozer android debug
