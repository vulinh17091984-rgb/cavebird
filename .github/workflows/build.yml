name: Build Game APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config libltdl-dev libffi-dev libssl-dev cmake openjdk-17-jdk aidl

      - name: Install Buildozer and Cython
        run: pip install buildozer cython==0.29.36

      - name: Auto Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android licenses || true

      - name: Clean Old Buildozer Cache
        run: buildozer android clean || true

      # --- BƯỚC THẦN KỲ: ÉP LIÊN KẾT ĐƯỜNG DẪN AIDL VÀO HỆ THỐNG BUILDOZER ---
      - name: Force Symlink for Aidl
        run: |
          # Khởi tạo trước cấu trúc thư mục SDK mà Buildozer sẽ tìm kiếm
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0
          
          # Ép liên kết file aidl hệ thống vào cả 2 thư mục build-tools để chặn mọi ngả đường lỗi
          ln -sf /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl
          ln -sf /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl
          echo "Đã ép liên kết đường dẫn Aidl thành công!"

      - name: Build Android APK with Buildozer
        run: buildozer android debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: CaveBird-Game-APK
          path: bin/*.apk
