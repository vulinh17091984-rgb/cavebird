name: Build Game APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libffi7 libssl3
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev unzip openjdk-17-jdk wget
        pip install --upgrade pip
        pip install Cython==0.29.33 python-for-android

    - name: Download and Setup Clean Android NDK r25c (TỰ TẢI BỘ DỊCH CHUẨN TỪ GOOGLE)
      run: |
        # Tải bộ NDK r25c chính thức từ máy chủ Google để tránh lỗi mất file clang trên GitHub
        wget -q https://google.com -O ndk.zip
        unzip -q ndk.zip
        # Di chuyển vào thư mục gọn gàng để ghim đường dẫn
        mv android-ndk-r25c $HOME/android-ndk-r25c
        echo "=== Đã tải và cài đặt Android NDK r25c sạch lỗi thành công ==="

    - name: Setup Virtual SDK Paths for Buildozer
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
        sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sudo sdkmanager
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        echo "=== Đã tạo đường dẫn liên kết ảo lừa hệ thống thành công ==="

    - name: Pure Android Compilation via Direct Toolchain (DỊCH GAME VỚI NDK RIÊNG)
      run: |
        # Ghim chính xác đường dẫn NDK sạch chúng ta vừa tự cài đặt ở bước trên
        export ANDROID_NDK_HOME=$HOME/android-ndk-r25c
        export ANDROID_NDK_ROOT=$HOME/android-ndk-r25c
        export ANDROID_NDK=$HOME/android-ndk-r25c
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # BƯỚC 1: Gọi nhân p4a tạo cấu trúc phân phối đồ họa Kivy dựa trên NDK r25c chuẩn
        p4a create --dist_name=cavebirdkivy --bootstrap=sdl2 --requirements=python3,kivy --arch=arm64-v8a --sdk-dir=$ANDROID_HOME --ndk-dir=$ANDROID_NDK --android_api=34 --ndk-api=21 --color=always
        
        # BƯỚC 2: Đóng gói trực tiếp file cài đặt APK game Cave Bird
        p4a apk --dist_name=cavebirdkivy --name="Cave Bird App" --version=1.3.0 --package=org.vulinh.cavebirdkivy --private=. --permission=INTERNET --orientation=portrait --arch=arm64-v8a --android_api=34 --ndk-api=21 --color=always

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CaveBird-Game-APK
        path: "*.apk"
