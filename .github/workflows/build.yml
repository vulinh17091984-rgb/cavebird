name: Build Game APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libffi7 libssl3
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev unzip openjdk-17-jdk
        pip install --upgrade pip
        # Cài đặt Cython bản ổn định nhất hệ thống
        pip install "Cython<3.0.0" python-for-android setuptools wheel build

    - name: Setup SDK Manager and Install NDK r25c Officially
      run: |
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
        echo "=== Đã cài đặt NDK r25c chính thức thành công ==="

    - name: Setup Virtual SDK Paths for Buildozer
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
        sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
        echo "=== Đã tạo đường dẫn liên kết ảo lừa hệ thống thành công ==="

    - name: Pure Android Compilation via Direct Toolchain (TẮT CÔ LẬP PIP)
      run: |
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_NDK=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # BIẾN MÔI TRƯỜNG CHÍ MẠNG: Ép pip ngầm không được cô lập môi trường build
        # Buộc nó phải lấy thư viện Cython có sẵn của máy chủ để dịch code C
        export PIP_NO_BUILD_ISOLATION=false
        export PIP_USE_PEP517=false
        
        # BƯỚC 1: Khởi tạo phân phối đồ họa Kivy chuẩn
        p4a create --dist_name=cavebirdkivy --bootstrap=sdl2 --requirements=python3,kivy,cython --arch=arm64-v8a --sdk-dir=$ANDROID_HOME --ndk-dir=$ANDROID_NDK --android_api=34 --ndk-api=21 --color=always
        
        # BƯỚC 2: Xuất file cài đặt APK hoàn chỉnh
        p4a apk --dist_name=cavebirdkivy --name="Cave Bird App" --version=1.3.0 --package=org.vulinh.cavebirdkivy --private=. --permission=INTERNET --orientation=portrait --arch=arm64-v8a --android_api=34 --ndk-api=21 --color=always

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CaveBird-Game-APK
        path: "*.apk"
