name: Build Game APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer và Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Install Android Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libffi7 libssl3
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y libstdc++6:i386 zlib1g:i386 openjdk-17-jdk
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    - name: Clean Corrupted Distribution Cache
      run: |
        # Xóa sạch thư mục phân phối cũ bị lỗi để ép p4a đóng gói lại từ đầu một cách sạch sẽ
        rm -rf .buildozer/android/platform/build-arm64-v8a/dists/
        echo "=== Đã dọn dẹp phân phối lỗi thành công ==="

    - name: Build Android APK with Pygame Backend
      run: |
        # Gỡ bỏ các biến môi trường NDK mặc định của GitHub
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK
        
        # Đồng ý điều khoản bản quyền và tiến hành biên dịch
        yes | buildozer android debug
