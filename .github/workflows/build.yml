name: Build Game APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # --- BƯỚC KHÓA LỖI LÕI: Ép máy chủ dùng Node 20 chuẩn để chạy bộ Setup Android không bị sập ---
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config libltdl-dev libffi-dev libssl-dev cmake openjdk-17-jdk aidl

      # Kích hoạt bộ tạo lập SDK tự động chính thức, có Node 20 gánh nên chạy siêu mượt
      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Install Buildozer and Cython
        run: pip install buildozer cython==0.29.36

      - name: Auto Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android licenses || true

      # Ép liên kết file aidl hệ thống vào đúng thư mục build-tools để chặn mọi ngả đường lỗi aidl
      - name: Force Symlink for Aidl
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/31.0.0
          ln -sf /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/31.0.0/aidl

      # Ép Buildozer nhận diện bộ SDK Manager chính chủ đã được Setup tự động ở trên
      - name: Build Android APK with Buildozer
        run: |
          export ANDROID_SDK_HOME=$ANDROID_HOME
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          buildozer android debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: CaveBird-Game-APK
          path: bin/*.apk
