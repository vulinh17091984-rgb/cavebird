name: Build Game APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev libffi7 libssl3
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y libstdc++6:i386 zlib1g:i386 openjdk-17-jdk
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    - name: Setup Virtual SDK Paths for Buildozer
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
        sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        echo "=== Đã tạo đường dẫn liên kết ảo lừa Buildozer thành công ==="

    - name: Force Clean Cache and Local Environment
      run: |
        # Xóa sạch toàn bộ tệp tin spec và thư mục tạm cục bộ trước khi sinh file mới
        rm -f buildozer.spec
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        rm -rf ~/.local/share/python-for-android/
        echo "=== Đã dọn sạch phân vùng kẹt cấu hình cũ ==="

    - name: Force Write New Kivy Spec
      run: |
        # Khởi tạo tệp cấu hình đóng gói Kivy chuẩn hóa
        cat << 'EOF' > buildozer.spec
        [app]
        title = Cave Bird App
        package.name = cavebirdapp
        package.domain = org.vulinh
        source.dir = .
        source.include_exts = py,png,jpg,jpeg,ttf,wav,mp3
        version = 1.0.2
        requirements = python3, kivy
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET
        android.sdk_path = /usr/local/lib/android/sdk
        android.ndk_path = /usr/local/lib/android/sdk/ndk/25.2.9519653
        android.archs = arm64-v8a
        android.api = 33
        android.minapi = 21
        android.enable_androidx = True
        android.release_artifact = apk
        android.debug_artifact = apk
        [buildozer]
        log_level = 0
        warn_on_root = 1
        EOF
        echo "=== Cấu hình Kivy đã sẵn sàng ==="

    - name: Build Android APK with Kivy Force Command
      run: |
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_NDK=/usr/local/lib/android/sdk/ndk/25.2.9519653
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # BỎ QUA CACHING TỰ ĐỘNG: Gọi trực tiếp toolchain của python-for-android 
        # Ép hệ thống tạo bản phân phối (dist) sạch theo đúng chuẩn bootstrap của Kivy (webview/webview) thay vì sdl2
        python3 -m pythonforandroid.toolchain create --dist_name=cavebirdapp --bootstrap=webview --requirements=python3,kivy --arch=arm64-v8a --storage-dir=.buildozer/android/platform/build-arm64-v8a --color=always || true
        
        # Gọi lệnh buildozer hoàn tất Gradle
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CaveBird-Game-APK
        path: bin/*.apk
